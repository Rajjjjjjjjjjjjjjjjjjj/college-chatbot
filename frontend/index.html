<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>College Assistant Chatbot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-circle">🎓</div>
        <div>
          <h1>College Assistant</h1>
          <p>Ask about admissions, timetable, exams, fees &amp; more</p>
        </div>
      </div>
      <span class="status-dot" id="statusDot" title="Checking backend..."></span>
    </header>

    <main class="chat-window" id="chatWindow">
      <div class="message bot">
        <div class="bubble">
          Hi! I'm your college assistant. Ask me about admissions, timetable,
          exams, fees, faculty, notices, or events.
        </div>
      </div>
    </main>

    <div class="quick-chips" id="quickChips">
      <button class="chip">Admission process</button>
      <button class="chip">Exam schedule</button>
      <button class="chip">Fee structure</button>
      <button class="chip">Upcoming events</button>
    </div>

    <form class="chat-input-row" id="chatForm">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your question..."
        autocomplete="off"
        required
      />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
