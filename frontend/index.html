<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kankavli College Assistant</title>
  
  <!-- Google Fonts: Poppins (Headings) & Roboto (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-circle">🎓</div>
        <div>
          <h1>Kankavli College Assistant</h1>
          <p>Ask about admissions, courses, fees, exams &amp; more</p>
        </div>
      </div>
      <span class="status-dot" id="statusDot" title="Checking backend..."></span>
    </header>

    <main class="chat-window" id="chatWindow">
      <div class="message bot">
        <div class="bubble">
          Hi! I'm the Kankavli College assistant. Ask me about admissions, courses, fees, exams, library or contact details.
        </div>
      </div>
    </main>

    <div class="quick-chips" id="quickChips">
      <button class="chip">Admission process</button>
      <button class="chip">Exam schedule</button>
      <button class="chip">Fee structure</button>
      <button class="chip">Upcoming events</button>
      <button class="chip">Courses offered</button>
      <button class="chip">Contact details</button>
    </div>

    <form class="chat-input-row" id="chatForm">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your question..."
        autocomplete="off"
        required
      />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
